name: whereisrico
arch: "${ARCH}"
platform: linux
version: "${VERSION}"
section: net
priority: optional
maintainer: "Rico Pajarola <rp@servium.ch>"
homepage: "https://github.com/rpajarola/whereisrico"
license: GPL-3.0-only
description: |
  Displays travel history on a world map. Ingests GPS tracks (GPX) and
  hand-authored trip/flight logs into a SQLite database and serves them as
  GeoJSON to MapLibre GL and CesiumJS web frontends.

depends:
  - systemd
  - adduser

contents:
  # nfpm's ${VAR} expansion only applies to top-level scalar fields (name,
  # version, arch, ...), not to contents[].src paths -- so build.sh builds
  # each arch's binaries into this fixed, non-arch-suffixed path and
  # invokes nfpm once per arch, rather than templating a path here.
  - src: dist/bin/whereisricod
    dst: /usr/bin/whereisricod
    file_info:
      mode: 0755

  - src: dist/bin/whereisricoctl
    dst: /usr/bin/whereisricoctl
    file_info:
      mode: 0755

  - src: web/static
    dst: /usr/share/whereisrico/static

  - src: packaging/systemd/whereisricod.service
    dst: /lib/systemd/system/whereisricod.service

  - src: packaging/systemd/whereisricoctl-ingest.service
    dst: /lib/systemd/system/whereisricoctl-ingest.service

  - src: packaging/systemd/whereisricoctl-ingest.timer
    dst: /lib/systemd/system/whereisricoctl-ingest.timer

  - src: packaging/whereisricod.default
    dst: /etc/default/whereisricod
    type: config|noreplace

  # Data directory -- deliberately outside /usr, owned by the dedicated
  # service user, and never removed by postremove.sh even on purge.
  - dst: /var/lib/whereisrico
    type: dir
    file_info:
      mode: 0750
      owner: whereisrico
      group: whereisrico
  - dst: /var/lib/whereisrico/trips
    type: dir
    file_info:
      mode: 0750
      owner: whereisrico
      group: whereisrico
  - dst: /var/lib/whereisrico/gpx
    type: dir
    file_info:
      mode: 0750
      owner: whereisrico
      group: whereisrico

scripts:
  preinstall: packaging/scripts/preinstall.sh
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh
